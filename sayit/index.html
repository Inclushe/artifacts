<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sayit port</title>
  <style>
    :root {
      --bg: #6b7280;
      --face: #f2f2f2;
      --face2: #fafafa;
      --line: #c8c8c8;
      --title: #3a3a3a;
      --text: #1a1a1a;
      --dim: #6b6b6b;
      --accent: #2563eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--face);
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
    }

    .window {
      width: 100%;
      max-width: 760px;
      border-radius: 8px;
      overflow: hidden;
    }

    .titlebar {
      background: var(--title);
      color: #f0f0f0;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    .dots {
      display: flex;
      gap: 7px;
      margin-right: 4px;
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #6e6e6e;
    }

    .titletext {
      flex: 1;
      text-align: center;
      margin-right: 52px;
      letter-spacing: .2px;
    }

    .body {
      padding: 16px;
    }

    fieldset {
      border: 1px solid var(--line);
      border-radius: 5px;
      margin: 0 0 12px 0;
      padding: 12px 14px 14px;
      background: var(--face2);
    }

    legend {
      font-size: 12px;
      color: var(--dim);
      padding: 0 5px;
    }

    #text {
      width: 100%;
      font-size: 15px;
      padding: 8px 9px;
      border: 1px solid #b9b9b9;
      border-radius: 3px;
      background: #fff;
      font-family: inherit;
      color: var(--text);
    }

    #text:focus {
      outline: 2px solid var(--accent);
      outline-offset: -1px;
      border-color: var(--accent);
    }

    .counter {
      display: none;
      font-size: 11px;
      color: var(--dim);
      text-align: right;
      margin-top: 4px;
    }

    .sliders {
      display: grid;
      grid-template-columns: auto 68px 1fr;
      gap: 11px 12px;
      align-items: center;
    }

    .sliders label {
      font-size: 14px;
    }

    .val {
      font-variant-numeric: tabular-nums;
      text-align: right;
      font-size: 14px;
      background: #fff;
      border: 1px solid #cfcfcf;
      border-radius: 3px;
      padding: 2px 6px;
      width: 68px;
      font-family: inherit;
      color: var(--text);
    }

    input[type=range] {
      width: 100%;
      accent-color: #7a7a7a;
    }

    .row {
      display: flex;
      gap: 9px;
      align-items: center;
      flex-wrap: wrap;
    }

    button {
      font: inherit;
      font-size: 14px;
      padding: 7px 20px;
      border: 1px solid #b0b0b0;
      background: linear-gradient(#fefefe, #efefef);
      border-radius: 4px;
      cursor: pointer;
      color: var(--text);
    }

    button:hover:not(:disabled) {
      background: linear-gradient(#fff, #f4f4f4);
      border-color: #8f8f8f;
    }

    button:active:not(:disabled) {
      background: #e6e6e6;
    }

    button:disabled {
      opacity: .5;
      cursor: default;
    }

    button.primary {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent) inset;
    }

    .spacer {
      flex: 1;
    }

    dialog {
      border: 1px solid #b0b0b0;
      border-radius: 7px;
      padding: 0;
      max-width: 460px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, .4);
    }

    dialog::backdrop {
      background: rgba(0, 0, 0, .35);
    }

    .dlg-body {
      padding: 18px 20px;
      font-size: 13.5px;
      line-height: 1.55;
    }

    .dlg-body h3 {
      margin: 0 0 10px;
      font-size: 15px;
    }

    .dlg-body p {
      margin: 0 0 10px;
    }

    .dlg-body code {
      background: #f0f0f0;
      padding: 1px 4px;
      border-radius: 3px;
      font-size: 12.5px;
    }

    .dlg-foot {
      padding: 0 20px 18px;
      text-align: right;
    }

    .quality {
      display: flex;
      gap: 10px 12px;
      align-items: center;
    }

    .quality label {
      font-size: 14px;
      flex-shrink: 0;
    }

    .quality+.advanced {
      margin-top: 11px;
    }

    .quality+.sliders {
      margin-top: 11px;
    }

    .advanced>summary {
      font-size: 12px;
      color: var(--dim);
      cursor: pointer;
      user-select: none;
      width: fit-content;
    }

    .advanced[open]>summary {
      margin-bottom: 11px;
    }

    select {
      font: inherit;
      font-size: 13.5px;
      padding: 5px 7px;
      border: 1px solid #b9b9b9;
      border-radius: 3px;
      background: #fff;
      color: var(--text);
      width: 100%;
    }

    @media screen and (max-width: 600px) {
      body {
        display: block;
      }

      .sliders label {
        /* grid-column: span 3; */
      }

      .sliders {
        grid-template-columns: auto 1fr;
        gap: 11px 0;
      }

      .sliders .val {
        margin-left: auto;
      }

      .sliders input[type="range"] {
        grid-column: span 3;
      }

      .quality {
        flex-wrap: wrap;
      }

      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .row .spacer {
        position: absolute;
      }

      #about {
        order: 1;
      }

      #defaults {
        order: 2;
      }
    }
  </style>
</head>

<body>
  <div class="window">
    <div class="body">
      <fieldset>
        <legend>Text to speak</legend>
        <input id="text" maxlength="500" autocomplete="off" spellcheck="false" value="Hello, I am a computer."
          aria-label="Text to speak">
        <div class="counter"><span id="count">0</span> / 500</div>
      </fieldset>

      <fieldset>
        <div class="sliders">
          <label for="pitch">Pitch</label>
          <input class="val" id="pitchv" inputmode="numeric" aria-label="Pitch value">
          <input type="range" id="pitch" min="100" max="10000" step="25">

          <label for="speed">Speed</label>
          <input class="val" id="speedv" inputmode="numeric" aria-label="Speed value">
          <input type="range" id="speed" min="1" max="200" step="1">

          <label for="mod">Modulation</label>
          <input class="val" id="modv" inputmode="numeric" aria-label="Modulation value">
          <input type="range" id="mod" min="0" max="10000" step="1">

          <label for="cascade">Cascade</label>
          <input class="val" id="cascadev" inputmode="numeric" aria-label="Cascade value">
          <input type="range" id="cascade" min="0" max="8" step="1">
        </div>
      </fieldset>

      <fieldset>
        <legend>Quality</legend>
        <div class="quality">
          <label for="rate">Sample rate</label>
          <select id="rate">
            <option value="8000">8 kHz</option>
            <option value="16000">16 kHz</option>
            <option value="22050">22.05 kHz</option>
            <option value="44100">44.1 kHz</option>
          </select>
        </div>
        <details class="advanced">
          <summary>Advanced</summary>
          <div class="quality">
            <label for="frame">Parameter update</label>
            <select id="frame">
              <option value="0">Tied to Speed</option>
              <option value="10">10 ms</option>
              <option value="5">5 ms</option>
            </select>
          </div>
          <div class="sliders">
            <label for="decl">Pitch fall</label>
            <input class="val" id="declv" inputmode="decimal" title="Hz per second"
              aria-label="Pitch fall in Hz per second">
            <input type="range" id="decl" min="0" max="10" step="0.1" title="Hz per second"
              aria-label="Pitch fall in Hz per second">

            <label for="burst">Noise trim</label>
            <input class="val" id="burstv" inputmode="numeric" title="dB"
              aria-label="Noise trim in dB">
            <input type="range" id="burst" min="-40" max="0" step="1" title="dB"
              aria-label="Noise trim in dB">

            <label for="smooth">Smoothing</label>
            <input class="val" id="smoothv" inputmode="numeric" title="percent"
              aria-label="Onset smoothing, percent">
            <input type="range" id="smooth" min="0" max="100" step="1" title="percent"
              aria-label="Onset smoothing, percent">

            <label for="tilt">Voice tilt</label>
            <input class="val" id="tiltv" inputmode="numeric" title="dB above the stock value of 1"
              aria-label="Voice tilt in dB">
            <input type="range" id="tilt" min="0" max="23" step="1"
              title="dB above the stock value of 1" aria-label="Voice tilt in dB">
          </div>
        </details>
      </fieldset>

      <div class="row">
        <button id="about">About</button>
        <button id="defaults">Defaults</button>
        <div class="spacer"></div>
        <button id="preview" class="primary">Preview</button>
        <button id="render">Render</button>
      </div>
    </div>
  </div>

  <dialog id="aboutdlg">
    <div class="dlg-body">
      <h3>sayit port</h3>
    </div>
    <div class="dlg-foot"><button id="aboutok">OK</button></div>
  </dialog>

          S.bypLP = Array.from({ length: 4 }, () => ({ y: 0, k: 1 - Math.exp(-2 * Math.PI * 4000 / R) }));
          S.rateExp = 8000 / R;
        } else { S.kopenK = 0.00833; S.noiseA = 0.75; S.noiseK = 1; S.bypLP = null; S.rateExp = 1; }
        S.seed = 5; S.time_count = 0; S.skew = 0;
        S.nper = 0; S.T0 = 0; S.nopen = 0; S.nmod = 0;
        S.natglot_a = 0; S.natglot_b = 0; S.vwave = 0;
        S.decay = 0; S.onemd = 0;
        const chunks = [];
        let total = 0;
        const trans = makeTranslator(phoneStr => {
          const { elm, frames } = phoneToElm(phoneStr);
          const max = frames * G.nspfr;
          if (max <= 0) return;
          const buf = new Int16Array(max);
          const n = holmes(G, defPars, elm, elm.length, buf);
          chunks.push(buf.subarray(0, n)); total += n;
        });
        trans.xlateString(String(text));
        trans.flush();
        const out = new Int16Array(total);
        let p = 0;
        for (const c of chunks) { out.set(c, p); p += c.length; }
        return out;
      }
      return { render, DEF_PARS };
    }


    // output stage (matches sayit.exe)
    function normalise(pcm) {
      let peak = 0;
      for (let i = 0; i < pcm.length; i++) { const a = Math.abs(pcm[i]); if (a > peak) peak = a; }
      const out = new Float32Array(pcm.length);
      if (peak === 0) return out;
      const scale = Math.fround(32767.0 / peak);
      for (let i = 0; i < pcm.length; i++) out[i] = Math.fround(Math.fround(pcm[i] * scale) / 32767.0);
      return out;
    }
    /* ratefast.c: cubic B-spline interpolation (recursive prefilter + 4-tap evaluation).
       Verified against sayit.exe output: image rejection matches to ~0.1 dB in 4-6 kHz. */
    function resample(src, fromRate, toRate) {
      const n = src.length;
      if (n === 0) return new Float32Array(0);
      const outLen = Math.trunc(n / fromRate * toRate);
      const out = new Float32Array(outLen);
      if (n === 1) { out.fill(src[0]); return out; }

      /* B-spline coefficients: causal / anti-causal recursion, pole z = sqrt(3) - 2 */
      const z = Math.sqrt(3) - 2;
      const c = new Float64Array(n);
      for (let i = 0; i < n; i++) c[i] = src[i] * 6;
      let horizon = Math.ceil(Math.log(1e-12) / Math.log(Math.abs(z)));
      if (horizon > n) horizon = n;
      let acc = 0, zk = 1;
      for (let i = 0; i < horizon; i++) { acc += c[i] * zk; zk *= z; }
      c[0] = acc;
      for (let i = 1; i < n; i++) c[i] = c[i] + z * c[i - 1];
      c[n - 1] = (z / (z * z - 1)) * (c[n - 1] + z * c[n - 2]);
      for (let i = n - 2; i >= 0; i--) c[i] = z * (c[i + 1] - c[i]);

      const step = fromRate / toRate;
      const at = i => c[i < 0 ? 0 : (i > n - 1 ? n - 1 : i)];
      for (let i = 0; i < outLen; i++) {
        const pos = i * step;
        const k = Math.floor(pos), t = pos - k, t2 = t * t, t3 = t2 * t;
        const w0 = (1 - 3 * t + 3 * t2 - t3) / 6;
        const w1 = (4 - 6 * t2 + 3 * t3) / 6;
        const w2 = (1 + 3 * t + 3 * t2 - 3 * t3) / 6;
        const w3 = t3 / 6;
        let v = w0 * at(k - 1) + w1 * at(k) + w2 * at(k + 1) + w3 * at(k + 2);
        if (v > 1) v = 1; else if (v < -1) v = -1;
        out[i] = v;
      }
      return out;
    }
    function encodeWav(samples, rate) {
      const buf = new ArrayBuffer(44 + samples.length * 2);
      const dv = new DataView(buf);
      const wstr = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
      wstr(0, 'RIFF'); dv.setUint32(4, 36 + samples.length * 2, true); wstr(8, 'WAVE');
      wstr(12, 'fmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
      dv.setUint32(24, rate, true); dv.setUint32(28, rate * 2, true);
      dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
      wstr(36, 'data'); dv.setUint32(40, samples.length * 2, true);
      for (let i = 0; i < samples.length; i++) {
        let s = Math.max(-1, Math.min(1, samples[i]));
        dv.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
      }
      return new Blob([buf], { type: 'audio/wav' });
    }

    // UI
    const DEFAULTS = { pitch: 700, speed: 12, mod: 47, cascade: 0 };
    /* Tuned by ear against a phone speaker. Zeroing burst/smooth/tilt (and leaving
       decl at 0) returns the engine to bit-exact sayit.exe at any sample rate. */
    const QDEFAULTS = { rate: '8000', frame: '0', decl: 0, burst: -16, smooth: 80, tilt: 12 };
    const CTL = ['pitch', 'speed', 'mod', 'cascade'];
    const $ = id => document.getElementById(id);
    const OUT_RATE = 44100;
    const engine = createSayIt(TABLES, ASCII_NAMES);
    let ctx = null, node = null;

    function load() {
      for (const k of CTL) { $(k).value = DEFAULTS[k]; $(k + 'v').value = DEFAULTS[k]; }
      $('rate').value = QDEFAULTS.rate; $('frame').value = QDEFAULTS.frame;
      $('decl').value = QDEFAULTS.decl; $('declv').value = QDEFAULTS.decl;
      $('burst').value = QDEFAULTS.burst; $('burstv').value = QDEFAULTS.burst;
      $('smooth').value = QDEFAULTS.smooth; $('smoothv').value = QDEFAULTS.smooth;
      $('tilt').value = QDEFAULTS.tilt; $('tiltv').value = QDEFAULTS.tilt;
      updateCount();
    }
    function opts() {
      const speed = +$('speed').value;
      const frame = +$('frame').value;
      return {
        pitch: +$('pitch').value, speed: speed, mod: +$('mod').value,
        cascade: +$('cascade').value, samrate: +$('rate').value,
        frameMs: frame > 0 ? frame : speed,
        /* slider is Hz/s; holmes wants a per-frame drop of `top` in 0.1 Hz units */
        decl: +$('decl').value * (frame > 0 ? frame : speed) / 80,
        burst: +$('burst').value,
        /* holmes' parameter smoother: 1.0 is off. Below ~0.6 short elements start
           dropping out, so the slider spans 1.0 down to 0.6 only. */
        frac: 1 - 0.4 * (+$('smooth').value) / 100,
        /* TLTdb offset above sayit.exe's value of 1; Klatt's own default is 10 */
        tilt: +$('tilt').value
      };
    }
    function updateCount() { $('count').textContent = $('text').value.length; }
    function setStatus(s) { console.info(s); }

    for (const k of ['rate', 'frame']) $(k).addEventListener('change', () => setStatus('Ready.'));
    $('decl').addEventListener('input', () => { $('declv').value = $('decl').value; });
    $('burst').addEventListener('input', () => { $('burstv').value = $('burst').value; });
    $('burstv').addEventListener('change', () => {
      let v = parseInt($('burstv').value, 10);
      if (!Number.isFinite(v)) v = 0;
      v = Math.max(-40, Math.min(0, v));
      $('burst').value = v; $('burstv').value = v;
    });
    $('smooth').addEventListener('input', () => { $('smoothv').value = $('smooth').value; });
    $('tilt').addEventListener('input', () => { $('tiltv').value = $('tilt').value; });
    $('tiltv').addEventListener('change', () => {
      let v = parseInt($('tiltv').value, 10);
      if (!Number.isFinite(v)) v = 0;
      v = Math.max(0, Math.min(23, v));
      $('tilt').value = v; $('tiltv').value = v;
    });
    $('smoothv').addEventListener('change', () => {
      let v = parseInt($('smoothv').value, 10);
      if (!Number.isFinite(v)) v = 0;
      v = Math.max(0, Math.min(100, v));
      $('smooth').value = v; $('smoothv').value = v;
    });
    $('declv').addEventListener('change', () => {
      let v = parseFloat($('declv').value);
      if (!Number.isFinite(v)) v = 0;
      v = Math.max(0, Math.min(10, Math.round(v * 10) / 10));
      $('decl').value = v; $('declv').value = v;
    });
    for (const k of CTL) {
      $(k).addEventListener('input', () => { $(k + 'v').value = $(k).value; });
      $(k + 'v').addEventListener('change', () => {
        const r = $(k);
        let v = parseInt($(k + 'v').value, 10);
        if (!Number.isFinite(v)) v = DEFAULTS[k];
        v = Math.max(+r.min, Math.min(+r.max, v));
        r.value = v; $(k + 'v').value = v;
      });
    }
    $('text').addEventListener('input', () => { updateCount(); });
    $('defaults').addEventListener('click', () => { load(); setStatus('Defaults restored.'); });
    $('about').addEventListener('click', () => $('aboutdlg').showModal());
    $('aboutok').addEventListener('click', () => $('aboutdlg').close());

    function busy(on) { for (const b of ['preview', 'render', 'defaults']) $(b).disabled = on; }

    function synth() {
      const text = $('text').value;
      if (!text.trim()) { setStatus('Nothing to say.'); return null; }
      const o = opts();
      const t0 = performance.now();
      const pcm = engine.render(text, o);
      if (!pcm.length) { setStatus('Nothing to say.'); return null; }
      const norm = normalise(pcm);
      const wav = (o.samrate === OUT_RATE) ? norm : resample(norm, o.samrate, OUT_RATE);
      const ms = Math.round(performance.now() - t0);
      const khz = (o.samrate / 1000).toFixed(o.samrate % 1000 ? 2 : 0) + ' kHz';
      setStatus(pcm.length + ' samples @ ' + khz +
        (o.samrate === OUT_RATE ? ' (native, no resampling)' : ' → 44.1 kHz') +
        ' · ' + o.frameMs + ' ms frames · ' + (wav.length / OUT_RATE).toFixed(2) +
        ' s · rendered in ' + ms + ' ms');
      return wav;
    }

    $('preview').addEventListener('click', () => {
      busy(true); setStatus('Synthesizing…');
      setTimeout(() => {
        try {
          const wav = synth();
          if (wav) {
            if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
            if (ctx.state === 'suspended') ctx.resume();
            if (node) { try { node.stop(); } catch (e) { } }
            const buf = ctx.createBuffer(1, wav.length, OUT_RATE);
            buf.getChannelData(0).set(wav);
            node = ctx.createBufferSource();
            node.buffer = buf; node.connect(ctx.destination); node.start();
          }
        } catch (e) { setStatus('Error: ' + e.message); }
        busy(false);
      }, 10);
    });

    $('render').addEventListener('click', () => {
      busy(true); setStatus('Synthesizing…');
      setTimeout(() => {
        try {
          const wav = synth();
          if (wav) {
            const url = URL.createObjectURL(encodeWav(wav, OUT_RATE));
            const a = document.createElement('a');
            const name = ($('text').value.trim().slice(0, 28).replace(/[^\w \-]+/g, '').trim() || 'sayit')
              .replace(/\s+/g, '_');
            a.href = url; a.download = name + '.wav';
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 4000);
          }
        } catch (e) { setStatus('Error: ' + e.message); }
        busy(false);
      }, 10);
    });

    $('text').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('preview').click(); } });

    load();
    setStatus('Ready.');
  </script>
</body>

</html>
